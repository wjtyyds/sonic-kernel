name: Build SONiC Kernel

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: '请选择编译版本 (输入 all 编译全部，或直接输入版本号如 6.18.49-flippy-95+o)'
        required: true
        type: string
        default: '6.18.49'
      device_type:
        description: '设备类型 (默认 amlogic，例外情况选 rk35xx)'
        required: false
        type: choice
        options:
          - amlogic
          - rk35xx
        default: 'amlogic'

permissions:
  contents: write

jobs:
  prepare_matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix_config: ${{ steps.generate.outputs.matrix_config }}
      has_jobs: ${{ steps.generate.outputs.has_jobs }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Build List and OS Matrix
        id: generate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET="${{ inputs.target_version }}"
          TARGET_CLEAN=$(echo "$TARGET" | tr ',;' '  ')
          DEVICE_TYPE="${{ inputs.device_type }}"
          
          BASE_VERSIONS=""
          if [ "$TARGET_CLEAN" == "all" ]; then
            if [ "$DEVICE_TYPE" == "rk35xx" ]; then
              AVAILABLE_RK=$(curl -s "https://api.github.com/repos/ophub/kernel/releases/tags/kernel_rk35xx" | jq -r '.assets[].name' | grep '\.tar\.gz$' | sed 's/\.tar\.gz$//' || true)
              BASE_VERSIONS=$(echo -e "$AVAILABLE_RK" | sort -u | grep -v '^$')
            else
              AVAILABLE_FLIPPY=$(curl -s "https://api.github.com/repos/wjtyyds/amlogic-s9xxx-armbian/releases/tags/kernel_flippy" | jq -r '.assets[].name' | grep '\.tar$' | sed 's/\.tar$//' || true)
              AVAILABLE_STABLE=$(curl -s "https://api.github.com/repos/wjtyyds/amlogic-s9xxx-armbian/releases/tags/kernel_stable" | jq -r '.assets[].name' | grep '\.tar\.gz$' | sed 's/\.tar\.gz$//' || true)
              BASE_VERSIONS=$(echo -e "$AVAILABLE_FLIPPY\n$AVAILABLE_STABLE" | sort -u | grep -v '^$')
            fi
          else
            for p in $TARGET_CLEAN; do
               BASE_VERSIONS="$BASE_VERSIONS $p"
            done
          fi

          mkdir -p /tmp/kernel_tars
          JSON_ARRAY="[]"
          
          for v in $BASE_VERSIONS; do
            TAR_FILE=""
            echo "📥 探测内核: $v"

            if [ "$DEVICE_TYPE" == "rk35xx" ]; then
              URL_RK="https://github.com/ophub/kernel/releases/download/kernel_rk35xx/${v}.tar.gz"
              if wget -qO /tmp/kernel_tars/${v}.tar.gz "$URL_RK"; then
                TAR_FILE="/tmp/kernel_tars/${v}.tar.gz"
              fi
            else
              URL_FLIPPY="https://github.com/wjtyyds/amlogic-s9xxx-armbian/releases/download/kernel_flippy/${v}.tar"
              URL_STABLE="https://github.com/wjtyyds/amlogic-s9xxx-armbian/releases/download/kernel_stable/${v}.tar.gz"
              
              if wget -qO /tmp/kernel_tars/${v}.tar "$URL_FLIPPY"; then
                TAR_FILE="/tmp/kernel_tars/${v}.tar"
              elif wget -qO /tmp/kernel_tars/${v}.tar.gz "$URL_STABLE"; then
                TAR_FILE="/tmp/kernel_tars/${v}.tar.gz"
              fi
            fi
            
            if [ -z "$TAR_FILE" ]; then 
              echo "❌ 下载 $v 失败, 跳过"
              continue
            fi
            
            mkdir -p /tmp/extract_${v}
            tar -xf "$TAR_FILE" -C /tmp/extract_${v} 2>/dev/null || true
            if [ -d "/tmp/extract_${v}/${v}" ]; then
              mv /tmp/extract_${v}/${v}/* /tmp/extract_${v}/ 2>/dev/null || true
              rm -rf /tmp/extract_${v}/${v}
            fi
            
            BOOT_TAR=$(find /tmp/extract_${v} -type f -name "boot-*.tar.gz" | head -n 1)
            if [ -z "$BOOT_TAR" ]; then continue; fi
            
            FULL_VER=$(basename "$BOOT_TAR" | sed -E 's/boot-(.*)\.tar\.gz/\1/')
            
            mkdir -p /tmp/boot_env_$v
            tar -zxf "$BOOT_TAR" -C /tmp/boot_env_$v 2>/dev/null || true
            CONFIG_FILE=$(find /tmp/boot_env_$v -type f -name "config-*" | head -n 1)
            
            COMPILER_TYPE="gcc"
            COMPILER_VER="11"
            RUNNER="ubuntu-22.04"
            
            if [ -n "$CONFIG_FILE" ]; then
              CC_TEXT=$(grep "CONFIG_CC_VERSION_TEXT=" "$CONFIG_FILE" | cut -d'=' -f2 | tr -d '"')
              if echo "$CC_TEXT" | grep -qi "clang"; then
                COMPILER_TYPE="clang"
                COMPILER_VER=$(echo "$CC_TEXT" | grep -oE 'clang version [0-9]+' | grep -oE '[0-9]+')
                if [ -z "$COMPILER_VER" ]; then COMPILER_VER="15"; fi
                if [ "$COMPILER_VER" -ge "16" ]; then RUNNER="ubuntu-24.04"; fi
              else
                COMPILER_TYPE="gcc"
                COMPILER_VER=$(echo "$CC_TEXT" | grep -oE '[0-9]+\.[0-9]+(\.[0-9]+)?' | tail -n 1 | cut -d'.' -f1)
                if [ -z "$COMPILER_VER" ]; then COMPILER_VER="11"; fi
                if [ "$COMPILER_VER" -lt "9" ]; then COMPILER_VER="9"; fi
                if [ "$COMPILER_VER" -ge "13" ]; then RUNNER="ubuntu-24.04"; fi
                if [ "$COMPILER_VER" -ge "15" ]; then COMPILER_VER="14"; fi
              fi
            fi
            
            echo "  [$FULL_VER] -> 指派 $COMPILER_TYPE $COMPILER_VER，调度: $RUNNER"
            JSON_ARRAY=$(echo "$JSON_ARRAY" | jq -c ". += [{\"base_version\": \"$v\", \"full_ver\": \"$FULL_VER\", \"os\": \"$RUNNER\", \"compiler_type\": \"$COMPILER_TYPE\", \"compiler_ver\": \"$COMPILER_VER\", \"device_type\": \"$DEVICE_TYPE\"}]")
          done
          
          if [ "$JSON_ARRAY" == "[]" ]; then echo "has_jobs=false" >> $GITHUB_OUTPUT
          else echo "has_jobs=true" >> $GITHUB_OUTPUT; echo "matrix_config=$JSON_ARRAY" >> $GITHUB_OUTPUT; fi

  build_and_release:
    needs: prepare_matrix
    if: needs.prepare_matrix.outputs.has_jobs == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare_matrix.outputs.matrix_config) }}
        
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Toolchain and Dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bison flex libssl-dev bc python3 git curl wget libelf-dev software-properties-common lsb-release gnupg cpio
          
          if [ "${{ matrix.compiler_type }}" == "gcc" ]; then
            sudo add-apt-repository ppa:ubuntu-toolchain-r/test -y
            sudo apt-get update
            sudo apt-get install -y gcc-${{ matrix.compiler_ver }}-aarch64-linux-gnu
            sudo ln -sf /usr/bin/aarch64-linux-gnu-gcc-${{ matrix.compiler_ver }} /usr/bin/aarch64-linux-gnu-gcc
          elif [ "${{ matrix.compiler_type }}" == "clang" ]; then
            if [ "${{ matrix.compiler_ver }}" -le 15 ]; then
              sudo apt-get install -y clang-${{ matrix.compiler_ver }} lld-${{ matrix.compiler_ver }} llvm-${{ matrix.compiler_ver }}
            else
              wget https://apt.llvm.org/llvm.sh
              chmod +x llvm.sh
              sudo ./llvm.sh ${{ matrix.compiler_ver }} all
            fi
            sudo apt-get install -y gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu
            sudo ln -sf /usr/bin/clang-${{ matrix.compiler_ver }} /usr/bin/clang
            sudo ln -sf /usr/bin/ld.lld-${{ matrix.compiler_ver }} /usr/bin/ld.lld
          fi

      - name: Run SONiC Kernel Build Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMPILER_TYPE: ${{ matrix.compiler_type }} 
          DEVICE_TYPE: ${{ matrix.device_type }}
        run: |
          chmod +x build_sonic_n1.sh
          ./build_sonic_n1.sh ${{ matrix.full_ver }}

      - name: Pack and Push to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 使用通配符动态抓取真实生成的 tar 包，无视之前的输入变量
          FINAL_TAR=$(find /workspace/build_sonic/final_release/ -name "*.tar" | head -n 1)
          
          if [ -z "$FINAL_TAR" ]; then echo "❌ 编译产物丢失，放弃发布！"; exit 1; fi

          TAR_FILENAME=$(basename "$FINAL_TAR")
          REAL_VERSION="${TAR_FILENAME%.tar}"
          
          cp "$FINAL_TAR" "$GITHUB_WORKSPACE/"

          TAG_NAME="SONiC_Kernel_${REAL_VERSION}"
          RELEASE_TITLE="SONiC Fullcone 全量内核 ${REAL_VERSION}"
          
          cat << EOF > release_notes.md
          # 🚀 SONiC Fullcone 深度整合内核
          - **内核版本**: \`${REAL_VERSION}\`
          - **核心特性**: 内嵌 SONiC 无锁结构 (RCU)、支持全协议 O(1) 查询。
          - **使用指引**: 将压缩包放入 \`openwrt_packit/opt/kernel\` 目录以打包固件。
          EOF

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" "$GITHUB_WORKSPACE/$TAR_FILENAME" --clobber
          else
            gh release create "$TAG_NAME" "$GITHUB_WORKSPACE/$TAR_FILENAME" --title "$RELEASE_TITLE" --notes-file release_notes.md
          fi